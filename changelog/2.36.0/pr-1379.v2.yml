type: fix
fix:
  description: |-
    Use Jackson 2.19 to prevent errors of the form:

    ```
    Execution failed for task ':writeMavenRepositories'.
     > java.lang.NoSuchFieldError: Class com.fasterxml.jackson.dataformat.xml.ser.XmlBeanSerializerBase does not have member field 'com.fasterxml.jackson.databind.ser.AnyGetterWriter _anyGetterWriter'
    ```
  links:
  - https://github.com/palantir/gradle-consistent-versions/pull/1379
