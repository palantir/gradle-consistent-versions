buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }

    dependencies {
        classpath 'com.palantir.jakartapackagealignment:jakarta-package-alignment:0.6.0'
        classpath 'com.palantir.gradle.jdks:gradle-jdks:0.69.0'
        classpath 'com.palantir.gradle.jdkslatest:gradle-jdks-latest:0.22.0'
        classpath 'com.palantir.gradle.plugintesting:gradle-plugin-testing:0.12.0'
        classpath 'com.palantir.gradle.externalpublish:gradle-external-publish-plugin:1.25.0'
        classpath 'com.palantir.gradle.failure-reports:gradle-failure-reports:1.16.0'
        classpath 'com.palantir.javaformat:gradle-palantir-java-format:2.75.0'
        classpath 'com.palantir.suppressible-error-prone:gradle-suppressible-error-prone:2.16.0'
        classpath 'com.palantir.gradle.consistentversions:gradle-consistent-versions:3.2.0'
        classpath 'com.palantir.baseline:gradle-baseline-java:6.61.0'
        classpath 'com.palantir.gradle.gitversion:gradle-git-version:4.0.0'
        classpath 'com.palantir.gradle.guide:gradle-guide:1.13.0'
        classpath 'com.palantir.gradle.idea-configuration:gradle-idea-configuration:0.5.0'
        classpath 'com.palantir.gradle.shadow-jar:gradle-shadow-jar:3.1.0'
    }
}

plugins {
 id 'com.gradle.plugin-publish' version '2.0.0'
}

apply plugin: 'com.palantir.external-publish'

apply plugin: 'com.palantir.baseline'
apply plugin: 'com.palantir.consistent-versions'
apply plugin: 'com.palantir.git-version'
apply plugin: 'com.palantir.gradle-guide'
apply plugin: 'com.palantir.jdks'

apply plugin: 'com.palantir.failure-reports'
apply plugin: 'com.palantir.baseline-java-versions'
apply plugin: 'com.palantir.jdks.latest'

version System.env.CIRCLE_TAG ?: gitVersion()

allprojects {
    apply plugin: 'com.palantir.java-format'
    apply plugin: 'com.palantir.jakarta-package-alignment'

    repositories {
        mavenCentral() { metadataSources { mavenPom(); ignoreGradleMetadataRedirection() } }
    }

    group 'com.palantir.gradle.consistentversions'
    version rootProject.version
}

tasks.withType(Test) {
    useJUnitPlatform()

    systemProperties = [
            'junit.platform.output.capture.stdout'                  : 'true',
            'junit.platform.output.capture.stderr'                  : 'true',
            'junit.jupiter.execution.parallel.enabled'              : 'true',
            'junit.jupiter.execution.parallel.config.strategy'      : 'dynamic',
            'junit.jupiter.execution.parallel.config.dynamic.factor': '1',
            // Ignore Gradle deprecations in tests. Note that we have to tackle those for the Gradle 8 update
            'ignoreDeprecations'                                    : 'true'
    ]
}

tasks.withType(JavaCompile) {
    // necessary until https://github.com/palantir/gradle-baseline/issues/389
    options.compilerArgs += ['-Werror']
    options.errorprone.disable 'Slf4jLogsafeArgs', 'PreferSafeLoggableExceptions'
}


tasks.publish.dependsOn tasks.publishPlugins
publishPlugins.onlyIf { !System.env.CI || versionDetails().isCleanTag }
project.ext.'gradle.publish.key' = System.env["GRADLE_KEY"]
project.ext.'gradle.publish.secret' = System.env["GRADLE_SECRET"]

javaVersions {
    libraryTarget = 17
}

jdks {
    daemonTarget = 21
}


